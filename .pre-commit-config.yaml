# STAGED 2026-10-05 for send-to-qbittorrent; not applied. Generated by media-function/tools/precommit_stage_media.py; edit the generator, not this file.
minimum_pre_commit_version: 3.2.0
default_install_hook_types:
- pre-commit
default_stages:
- pre-commit
repos:
- repo: local
  hooks:
  - id: gitleaks-staged
    name: gitleaks (staged changes)
    entry: gitleaks git --pre-commit --redact --staged --no-banner --verbose
    language: system
    pass_filenames: false
    always_run: true
  - id: gitleaks-files
    name: gitleaks (tracked files, manual stage)
    entry: bash -c 'rc=0; for f in "$@"; do gitleaks dir --redact --no-banner --verbose "$f" || rc=1; done; exit $rc' --
    language: system
    stages:
    - manual
    require_serial: true
  - id: yamllint
    name: yamllint
    entry: yamllint --format parsable --config-file .yamllint.yaml
    language: system
    files: \.ya?ml$
  - id: compose-lint
    name: compose-lint
    entry: compose-lint --fail-on high --strict-config --skip-suppressed --config .compose-lint.yml
    language: system
    files: ^stack/compose\.ya?ml$
  - id: compose-config
    name: compose config
    entry: bash -c 'for f; do env -i PATH="$PATH" HOME=/nonexistent COMPOSE_EXPERIMENTAL_GIT_REMOTE=0 COMPOSE_EXPERIMENTAL_OCI_REMOTE=0 docker compose -f "$f" --env-file /dev/null config --no-env-resolution -q || exit 1; done' --
    language: system
    files: ^stack/compose\.ya?ml$
  - id: compose-no-comments
    name: 'compose: no comments'
    entry: ^(?:\s*#|(?:(?>[\[{,]*"(?:[^"\\\n]|\\.)*"|[\[{,]*'(?:[^'\n]|'')*'|\S+)|(?>\s+))*?\s+#)
    language: pygrep
    files: ^stack/compose\.ya?ml$
  - id: markdownlint-cli2
    name: markdownlint-cli2
    entry: markdownlint-cli2 --config .markdownlint-cli2.yaml
    language: system
    files: \.md$
  - id: lychee-offline
    name: 'lychee (offline: local files and anchors)'
    entry: lychee --offline --no-progress --include-fragments=anchor-only
    language: system
    files: \.md$
